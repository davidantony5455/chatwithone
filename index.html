<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Strangers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Landing Page -->
        <div id="landing-page" class="page active">
            <div class="landing-content">
                <h1>Chat with Strangers</h1>
                <p>Meet new people and have conversations with random strangers from around the world.</p>
                <button id="start-chat-btn" class="btn btn-primary">Start Chat</button>
            </div>
        </div>

        <!-- Chat Page -->
        <div id="chat-page" class="page">
            <div class="chat-header">
                <div class="chat-info">
                    <span class="status-dot"></span>
                    <span id="chat-status">Connecting to stranger...</span>
                </div>
                <div class="chat-actions">
                    <button id="new-stranger-btn" class="btn btn-secondary">Find New Stranger</button>
                    <button id="disconnect-btn" class="btn btn-danger">Disconnect</button>
                </div>
            </div>
            
            <div id="chat-messages" class="chat-messages">
                <div class="message system-message">
                    Waiting for a stranger to connect...
                </div>
            </div>
            
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="Type a message..." disabled>
                <button id="send-btn" class="btn btn-primary" disabled>Send</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
