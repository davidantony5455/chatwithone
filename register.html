<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatWithOne.com - Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-box register-box">
            <h1>💬 ChatWithOne.com</h1>
            <p class="tagline">Create your account!</p>
            
            <form id="registerForm">
                <div class="input-group">
                    <label for="name">Username</label>
                    <input type="text" id="name" name="name" required placeholder="Choose a username">
                </div>
                
                <div class="input-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" required min="13" placeholder="Enter your age (13+)">
                </div>
                
                <div class="input-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select your gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                        <option value="prefer-not-to-say">Prefer not to say</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create a password">
                </div>
                
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password">
                </div>
                
                <button type="submit" class="btn-primary">Register</button>
                <p class="message" id="registerMessage"></p>
            </form>
            
            <p class="register-link">
                Already have an account? <a href="index.html">Login here</a>
            </p>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
